<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LemonCAD - Dispatch System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        sidebar {
            width: 250px;
            background-color: #161616;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .logo-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .mockup-logo-box {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 8px;
            width: 85px;
            height: 85px;
        }
        .logo-text {
            font-size: 14px;
            font-weight: bold;
            color: #e0e0e0;
        }
        .nav-links {
            list-style: none;
            padding: 5px 0;
            flex: 1;
        }
        .nav-links li {
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: 500;
            font-size: 13.5px;
            color: #bbb;
        }
        .nav-links li:hover {
            background-color: #1c1c1c;
            color: #fff;
        }
        .nav-links li.active {
            background-color: #222;
            color: #4CAF50;
            border-left: 4px solid #4CAF50;
            font-weight: 600;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #181818;
            overflow: hidden;
        }
        header {
            height: 60px;
            min-height: 60px;
            background-color: #181818;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }
        .header-title {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }
        .content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 4px;
            color: #fff;
            font-weight: 600;
        }
        .dispatch-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }
        .dispatch-card {
            background-color: #222;
            border-left: 5px solid #ff4d4d;
            padding: 15px 20px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .dispatch-card h3 {
            color: #ff4d4d;
            margin-bottom: 5px;
        }
        .dispatch-card p {
            margin: 4px 0;
            font-size: 14px;
            color: #bbb;
        }
        #alert-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #d9534f;
            color: white;
            padding: 15px 25px;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-20px);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
        }
        #alert-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div id="alert-popup">🚨 New In-Game Dispatch Received!</div>

    <sidebar>
        <div>
            <div class="logo-container">
                <div class="mockup-logo-box">
                    <svg viewBox="0 0 100 100" width="100" height="100">
                        <text x="50%" y="32" font-size="16" font-weight="900" fill="#111" text-anchor="middle" font-family="Arial">LEMON'S</text>
                        <path d="M35 48 C35 38 65 38 65 48 C65 62 50 72 50 72 C50 72 35 62 35 48 Z" fill="#FFC107"/>
                        <circle cx="50" cy="52" r="3" fill="#FFF"/>
                        <text x="50%" y="86" font-size="11" font-weight="bold" fill="#333" text-anchor="middle" font-family="Arial">LemonCAD</text>
                    </svg>
                </div>
                <div class="logo-text">LemonCAD</div>
            </div>
            <ul class="nav-links">
                <li class="active">Dispatch Overview</li>
            </ul>
        </div>
    </sidebar>

    <main>
        <header>
            <div class="header-title" id="page-title">Live Dispatch Center</div>
        </header>

        <div class="content-area">
            <div id="dispatch" class="tab-content active">
                <h2>Active Dispatches</h2>
                <p style="color: #777; font-size: 13.5px;">Live in-game dispatches from ER:LC.</p>
                <div class="dispatch-container" id="dispatch-list">
                    <div style="color: #666; font-style: italic;">Loading dispatches...</div>
                </div>
            </div>
        </div>
    </main>

    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        let lastDispatchCount = 0;
        let alertTimeout = null;

        async function fetchDispatches() {
            try {
                const response = await fetch('/api/dispatches');
                const dispatches = await response.json();
                const listContainer = document.getElementById('dispatch-list');

                if (dispatches.length === 0) {
                    listContainer.innerHTML = '<div style="color: #666; font-style: italic;">No active dispatches...</div>';
                    lastDispatchCount = 0;
                    return;
                }

                if (dispatches.length > lastDispatchCount && lastDispatchCount !== 0) {
                    triggerAlert();
                }
                lastDispatchCount = dispatches.length;

                listContainer.innerHTML = '';
                dispatches.forEach(d => {
                    const card = document.createElement('div');
                    card.className = 'dispatch-card';
                    card.innerHTML = `
                        <h3>🚨 ${d.title}</h3>
                        <p><strong>Location:</strong> ${d.location}</p>
                        <p><strong>Details:</strong> ${d.description}</p>
                        <p><strong>Time:</strong> ${d.time}</p>
                    `;
                    listContainer.appendChild(card);
                });

            } catch (err) {
                console.error('Error fetching dispatches:', err);
            }
        }

        function triggerAlert() {
            const sound = document.getElementById('alert-sound');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log('Autoplay blocked by browser:', e));
            }

            const popup = document.getElementById('alert-popup');
            popup.classList.add('show');
            
            if (alertTimeout) clearTimeout(alertTimeout);
            alertTimeout = setTimeout(() => {
                popup.classList.remove('show');
            }, 5000);
        }

        setInterval(fetchDispatches, 3000);
        fetchDispatches();
    </script>
</body>
</html>
