<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lemon's RP - CAD System</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        /* Fresh lemon logo background color */
        background-color: #fbfdf4;
        /* Dark yellow/brown logo text color */
        color: #7c7c0c;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        width: 100%;
        max-width: 900px;
      }

      /* Header styling with Logo */
      .header-container {
        text-align: center;
        margin-bottom: 30px;
      }

      .header-logo {
        max-width: 180px;
        height: auto;
        margin-bottom: 12px;
      }

      h1 {
        color: #7c7c0c;
        font-size: 2rem;
        font-weight: 800;
        margin: 0;
        letter-spacing: -0.5px;
      }

      /* Layout Grid */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
        gap: 24px;
      }

      /* White cards for nice contrast on light background */
      .card {
        background-color: #ffffff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 25px -5px rgba(124, 124, 12, 0.08),
          0 8px 10px -6px rgba(124, 124, 12, 0.04);
        border: 1px solid rgba(124, 124, 12, 0.12);
      }

      h2 {
        color: #616109;
        font-size: 1.25rem;
        font-weight: 700;
        margin-top: 0;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #f2f5e4;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      h3 {
        color: #7c7c0c;
        font-size: 1.05rem;
        margin-top: 0;
        margin-bottom: 12px;
      }

      /* Forms & Inputs */
      .form-group {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        margin-bottom: 6px;
        color: #7c7c0c;
      }

      input,
      select {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1.5px solid #e1e7cc;
        background-color: #fafcf5;
        color: #424203;
        font-size: 0.95rem;
        outline: none;
        transition: all 0.2s ease;
      }

      input:focus,
      select:focus {
        border-color: #b3b318;
        box-shadow: 0 0 0 3px rgba(179, 179, 24, 0.15);
        background-color: #ffffff;
      }

      /* Buttons styled in Lemon RP accent colors */
      .btn {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: none;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-bottom: 12px;
      }

      .btn-primary {
        background-color: #eab308; /* Lemon yellow */
        color: #424203;
      }

      .btn-primary:hover {
        background-color: #ca8a04;
        color: #ffffff;
      }

      .btn-secondary {
        background-color: #f2f5e4;
        color: #7c7c0c;
        border: 1px solid #e1e7cc;
      }

      .btn-secondary:hover {
        background-color: #e1e7cc;
      }

      hr {
        border: none;
        border-top: 1px solid #f2f5e4;
        margin: 20px 0;
      }

      /* Result boxes */
      .result-box {
        margin-top: 15px;
        padding: 14px;
        border-radius: 10px;
        background-color: #fafcf5;
        border: 1px dashed #b3b318;
        font-size: 0.9rem;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header with Lemon Logo -->
      <div class="header-container">
        <img src="logolemon.png" alt="Lemon's RP Logo" class="header-logo" />
        <h1>Computer-Aided Dispatch (CAD)</h1>
      </div>

      <div class="grid">
        <!-- 1. Civilian Registration & NCIC -->
        <div class="card">
          <h2>👤 Civilian Database</h2>

          <form id="civilianForm">
            <div class="form-group">
              <label>Full Name</label>
              <input
                type="text"
                id="civName"
                placeholder="e.g. John Doe"
                required
              />
            </div>
            <div class="form-group">
              <label>Date of Birth</label>
              <input type="date" id="civDob" required />
            </div>
            <div class="form-group">
              <label>Gender</label>
              <select id="civGender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other / Non-Binary</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">
              Register Civilian
            </button>
          </form>

          <hr />

          <h3>NCIC Lookup</h3>
          <div class="form-group">
            <input
              type="text"
              id="searchName"
              placeholder="Search by name..."
            />
          </div>
          <button
            type="button"
            onclick="searchCivilian()"
            class="btn btn-secondary"
          >
            Search Person
          </button>
          <div id="civResult" class="result-box"></div>
        </div>

        <!-- 2. DMV Vehicle Registration -->
        <div class="card">
          <h2>🚘 DMV Vehicle Database</h2>

          <form id="vehicleForm">
            <div class="form-group">
              <label>License Plate</label>
              <input
                type="text"
                id="vehPlate"
                placeholder="e.g. 83ABC12"
                required
              />
            </div>
            <div class="form-group">
              <label>Vehicle Model</label>
              <input
                type="text"
                id="vehModel"
                placeholder="e.g. Vapid Stanier"
                required
              />
            </div>
            <div class="form-group">
              <label>Owner Name</label>
              <input
                type="text"
                id="vehOwner"
                placeholder="Owner's full name"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary">
              Register Vehicle
            </button>
          </form>

          <hr />

          <h3>DMV Lookup</h3>
          <div class="form-group">
            <input
              type="text"
              id="searchPlate"
              placeholder="Search by license plate..."
            />
          </div>
          <button
            type="button"
            onclick="searchVehicle()"
            class="btn btn-secondary"
          >
            Search Plate
          </button>
          <div id="vehResult" class="result-box"></div>
        </div>
      </div>
    </div>

    <!-- Script for Forms & API Requests -->
    <script>
      // Register Civilian
      document
        .getElementById('civilianForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();
          const data = {
            name: document.getElementById('civName').value,
            dob: document.getElementById('civDob').value,
            gender: document.getElementById('civGender').value,
          };
          const res = await fetch('/api/civilians', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          if (res.ok) {
            alert('✅ Civilian registered successfully!');
            document.getElementById('civilianForm').reset();
          }
        });

      // Register Vehicle
      document
        .getElementById('vehicleForm')
        .addEventListener('submit', async (e) => {
          e.preventDefault();
          const data = {
            plate: document.getElementById('vehPlate').value,
            model: document.getElementById('vehModel').value,
            owner: document.getElementById('vehOwner').value,
          };
          const res = await fetch('/api/vehicles', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          if (res.ok) {
            alert('✅ Vehicle registered successfully!');
            document.getElementById('vehicleForm').reset();
          }
        });

      // Search Civilian
      async function searchCivilian() {
        const name = document.getElementById('searchName').value;
        const res = await fetch(
          `/api/civilians/search?name=${encodeURIComponent(name)}`
        );
        const resultDiv = document.getElementById('civResult');
        resultDiv.style.display = 'block';

        if (res.ok) {
          const data = await res.json();
          resultDiv.innerHTML = `<strong>Found:</strong> ${data.name}<br><strong>Date of Birth:</strong> ${data.dob}<br><strong>Gender:</strong> ${data.gender}`;
        } else {
          resultDiv.innerHTML = '❌ No person found with this name.';
        }
      }

      // Search Vehicle
      async function searchVehicle() {
        const plate = document.getElementById('searchPlate').value;
        const res = await fetch(
          `/api/vehicles/search?plate=${encodeURIComponent(plate)}`
        );
        const resultDiv = document.getElementById('vehResult');
        resultDiv.style.display = 'block';

        if (res.ok) {
          const data = await res.json();
          resultDiv.innerHTML = `<strong>License Plate:</strong> ${data.plate}<br><strong>Model:</strong> ${data.model}<br><strong>Owner:</strong> ${data.owner}`;
        } else {
          resultDiv.innerHTML = '❌ No vehicle found with this license plate.';
        }
      }
    </script>
  </body>
</html>
