<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LemonCAD - ER:LC System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #faf8f5;
            color: #444;
            margin: 0;
            padding: 20px;
        }
        .header-container {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #5d532a;
            font-size: 24px;
            margin: 10px 0 20px 0;
            text-align: center;
            font-weight: bold;
        }
        /* Navigatie menu */
        .navbar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .nav-btn {
            background-color: #e5dfd3;
            color: #5d532a;
            border: 1px solid #dcd3be;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-btn.active, .nav-btn:hover {
            background-color: #e2a000;
            color: #fff;
            border-color: #cca200;
        }
        /* Layout grid exact zoals in je ontwerp */
        .grid-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border: 1px solid #e8e1d5;
            border-radius: 10px;
            padding: 20px;
            width: 420px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            box-sizing: border-box;
        }
        .full-width-card {
            background: #fff;
            border: 1px solid #e8e1d5;
            border-radius: 10px;
            padding: 20px;
            max-width: 864px;
            margin: 0 auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            box-sizing: border-box;
        }
        .page-section {
            display: none;
        }
        .page-section.active {
            display: block;
        }
        h3 {
            color: #5d532a;
            font-size: 15px;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid #f0ebe1;
            padding-bottom: 8px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #6b6038;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #dcd3be;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
            color: #333;
        }
        input::placeholder {
            color: #aaa;
        }
        .btn-primary {
            background-color: #e2a000;
            color: white;
            border: none;
            padding: 11px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 5px;
        }
        .btn-primary:hover {
            background-color: #cc8f00;
        }
        .btn-secondary {
            background-color: #f4efe4;
            color: #5d532a;
            border: 1px solid #e2d8c3;
            padding: 11px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 5px;
        }
        .btn-secondary:hover {
            background-color: #e9e2d3;
        }
        .result-box {
            background: #faf8f5;
            border: 1px dashed #dcd3be;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 13px;
        }
        .dispatch-card {
            background: #fff8e8;
            border-left: 4px solid #e2a000;
            padding: 12px;
            margin-top: 10px;
            border-radius: 4px;
            font-size: 13px;
        }
        .map-frame {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <!-- Server Header Branding -->
        <h2>🍋 LEMON'S</h2>
        <div style="font-size: 11px; font-weight: bold; letter-spacing: 2px; color: #7a6e43; margin-top: -12px; margin-bottom: 15px;">RP SERVER</div>
        <h1>Computer-Aided Dispatch (CAD)</h1>

        <!-- Navigatie menu in dezelfde stijl -->
        <div class="navbar">
            <button class="nav-btn active" id="btnReg" onclick="switchTab('registration')">CAD / Registration</button>
            <button class="nav-btn" id="btnDisp" onclick="switchTab('dispatch')">Dispatch / Meldkamer</button>
            <button class="nav-btn" id="btnMap" onclick="switchTab('map')">Interactive Map</button>
        </div>
    </div>

    <!-- SECTIE 1: REGISTRATION & LOOKUP -->
    <div id="section-registration" class="page-section active">
        <div class="grid-container">
            <!-- Linker Kolom: Civilian Database & NCIC Lookup -->
            <div class="card">
                <h3>👤 Civilian Database</h3>
                <label>Full Name</label>
                <input type="text" id="civName" placeholder="e.g. John Doe">
                
                <label>Date of Birth</label>
                <input type="date" id="civDob">
                
                <label>Gender</label>
                <select id="civGender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Unknown">Other</option>
                </select>
                
                <button class="btn-primary" onclick="registerCivilian()">Register Civilian</button>

                <h3 style="margin-top: 25px;">NCIC Lookup</h3>
                <label>Search Person</label>
                <input type="text" id="searchCivName" placeholder="Search by name...">
                <button class="btn-secondary" onclick="searchCivilian()">Search Person</button>
                <div id="civResult" class="result-box" style="display:none;"></div>
            </div>

            <!-- Rechter Kolom: DMV Vehicle Database & DMV Lookup -->
            <div class="card">
                <h3>🚗 DMV Vehicle Database</h3>
                <label>License Plate</label>
                <input type="text" id="vehPlate" placeholder="e.g. 83ABC12">
                
                <label>Vehicle Model</label>
                <input type="text" id="vehModel" placeholder="e.g. Vapid Stanier">
                
                <label>Owner Name</label>
                <input type="text" id="vehOwner" placeholder="Owner's full name">
                
                <button class="btn-primary" onclick="registerVehicle()">Register Vehicle</button>

                <h3 style="margin-top: 25px;">DMV Lookup</h3>
                <label>Search License Plate</label>
                <input type="text" id="searchVehPlate" placeholder="Search by license plate...">
                <button class="btn-secondary" onclick="searchVehicle()">Search Plate</button>
                <div id="vehResult" class="result-box" style="display:none;"></div>
            </div>
        </div>
    </div>

    <!-- SECTIE 2: DISPATCH / MELDKAMER -->
    <div id="section-dispatch" class="page-section">
        <div class="full-width-card">
            <h3>🚨 Dispatch / Meldkamer</h3>
            
            <label>Incident Title</label>
            <input type="text" id="dispatchTitle" placeholder="e.g. Bank Robbery / Traffic Accident">
            
            <label>Location</label>
            <input type="text" id="dispatchLocation" placeholder="e.g. Main Street / Highway 1">
            
            <label>Priority</label>
            <select id="dispatchPriority">
                <option value="Normal">Normal Priority</option>
                <option value="High">High Priority</option>
                <option value="Emergency">🚨 EMERGENCY (Code 3)</option>
            </select>
            
            <label>Description Details</label>
            <textarea id="dispatchDesc" placeholder="Enter call details..." rows="3"></textarea>
            
            <button class="btn-primary" onclick="createDispatch()">Dispatch Call</button>

            <h3 style="margin-top: 25px;">Active Dispatches</h3>
            <button class="btn-secondary" onclick="loadDispatches()" style="margin-bottom: 15px;">Refresh Calls</button>
            <div id="dispatchList"></div>
        </div>
    </div>

    <!-- SECTIE 3: INTERACTIVE MAP -->
    <div id="section-map" class="page-section">
        <div class="full-width-card">
            <h3>🗺️ Liberty County Interactive Map</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Live interactive map provided by ER:LC Hub.</p>
            <iframe class="map-frame" src="https://erlc-hub.pages.dev/" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

            if (tabName === 'registration') {
                document.getElementById('section-registration').classList.add('active');
                document.getElementById('btnReg').classList.add('active');
            } else if (tabName === 'dispatch') {
                document.getElementById('section-dispatch').classList.add('active');
                document.getElementById('btnDisp').classList.add('active');
                loadDispatches();
            } else if (tabName === 'map') {
                document.getElementById('section-map').classList.add('active');
                document.getElementById('btnMap').classList.add('active');
            }
        }

        async function registerCivilian() {
            var name = document.getElementById('civName').value;
            var dob = document.getElementById('civDob').value;
            var gender = document.getElementById('civGender').value;

            var res = await fetch('/api/civilians', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, dob, gender })
            });
            var data = await res.json();
            if (res.ok) {
                alert('Civilian registered successfully!');
                document.getElementById('civName').value = '';
                document.getElementById('civDob').value = '';
            } else {
                alert('Error: ' + data.error);
            }
        }

        async function searchCivilian() {
            var name = document.getElementById('searchCivName').value;
            var res = await fetch('/api/civilians/search?name=' + encodeURIComponent(name));
            var box = document.getElementById('civResult');
            box.style.display = 'block';

            if (res.ok) {
                var c = await res.json();
                box.innerHTML = `<strong>Found:</strong> ${c.name}<br><strong>Date of Birth:</strong> ${c.dob}<br><strong>Gender:</strong> ${c.gender}`;
            } else {
                box.innerHTML = `<i>No civilian found.</i>`;
            }
        }

        async function registerVehicle() {
            var plate = document.getElementById('vehPlate').value;
            var model = document.getElementById('vehModel').value;
            var owner = document.getElementById('vehOwner').value;

            var res = await fetch('/api/vehicles', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ plate, model, owner })
            });
            var data = await res.json();
            if (res.ok) {
                alert('Vehicle registered successfully!');
                document.getElementById('vehPlate').value = '';
                document.getElementById('vehModel').value = '';
                document.getElementById('vehOwner').value = '';
            } else {
                alert('Error: ' + data.error);
            }
        }

        async function searchVehicle() {
            var plate = document.getElementById('searchVehPlate').value;
            var res = await fetch('/api/vehicles/search?plate=' + encodeURIComponent(plate));
            var box = document.getElementById('vehResult');
            box.style.display = 'block';

            if (res.ok) {
                var v = await res.json();
                box.innerHTML = `<strong>Plate:</strong> ${v.plate}<br><strong>Model:</strong> ${v.model}<br><strong>Owner:</strong> ${v.owner}`;
            } else {
                box.innerHTML = `<i>No vehicle found.</i>`;
            }
        }

        async function createDispatch() {
            var title = document.getElementById('dispatchTitle').value;
            var location = document.getElementById('dispatchLocation').value;
            var priority = document.getElementById('dispatchPriority').value;
            var description = document.getElementById('dispatchDesc').value;

            var res = await fetch('/api/dispatches', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, location, priority, description })
            });

            if (res.ok) {
                alert('Dispatch call sent successfully!');
                document.getElementById('dispatchTitle').value = '';
                document.getElementById('dispatchLocation').value = '';
                document.getElementById('dispatchDesc').value = '';
                loadDispatches();
            } else {
                alert('Failed to send dispatch.');
            }
        }

        async function loadDispatches() {
            var res = await fetch('/api/dispatches');
            var dispatches = await res.json();
            var listDiv = document.getElementById('dispatchList');
            listDiv.innerHTML = '';

            if (dispatches.length === 0) {
                listDiv.innerHTML = '<p style="font-size:13px; color:#777;"><i>No active dispatch calls.</i></p>';
                return;
            }

            dispatches.forEach(d => {
                var card = document.createElement('div');
                card.className = 'dispatch-card';
                card.innerHTML = `<strong>[${d.priority}] ${d.title}</strong><br>
                                  📍 <b>Location:</b> ${d.location}<br>
                                  💬 <b>Details:</b> ${d.description}<br>
                                  🕒 <b>Time:</b> ${d.time}`;
                listDiv.appendChild(card);
            });
        }
    </script>
</body>
</html>
